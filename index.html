<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parte Diario 2.0</title>
    <style>
        /* RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 48px; min-height: 100vh; }
        .container { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        /* EFECTO CRISTAL (GLASS) */
        .glass {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .border-highlight { border-color: rgba(16, 185, 129, 0.3); }

        /* ENCABEZADO */
        .header { display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .icon-badge { width: 40px; height: 40px; border-radius: 50%; background: rgba(16, 185, 129, 0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-title { font-size: 16px; font-weight: 700; color: #ffffff; }
        .header-subtitle { font-size: 12px; color: #94a3b8; }

        /* BOTONES PRINCIPALES */
        .btn-main {
            background-color: #10b981;
            color: #022c22;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-main:active { transform: scale(0.97); }

        /* FORMULARIOS & INPUTS */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        label { font-size: 12px; color: #94a3b8; font-weight: 500; }
        input[type="text"], input[type="number"] {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            color-scheme: dark;
        }
        input:focus { border-color: #10b981; }

            border: 1px solid #334155;
            color: #cbd5e1;
